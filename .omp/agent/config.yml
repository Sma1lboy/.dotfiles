modelRoles:
  slow: anthropic/claude-fable-5-1
  advisor: anthropic/claude-fable-5-1
  consult: anthropic/claude-opus-5-5
  plan: openai-codex/gpt-6-astra
  smol: openai-codex/gpt-6-sol
  task: anthropic/claude-sonnet-5-5
  tiny: openai-codex/gpt-6-luna
  default: anthropic/claude-opus-5-5
symbolPreset: nerd
composer:
  shape: claude
theme:
  dark: titanium-custom
  light: light
setupVersion: 2
hideThinkingBlock: true
display:
  hideToolActivity: false
tools:
  intentTracing: true
todo:
  enabled: false
enabledProviders:
  - claude
commands:
  enableClaudeUser: true
startup:
  quiet: false
statusLine:
  preset: custom
  leftSegments:
    - pi
    - vim
    - model
    - mode
    - collab
    - stream
    - path
    - git
    - pr
    - cost
  rightSegments:
    - session_name
  separator: powerline-thin
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
doubleEscapeAction: none
memory:
  backend: local
autolearn:
  enabled: true
claudeResets:
  autoRedeem: "no"
dev:
  autoqaConsent: granted
extendedContext: true
defaultThinkingLevel: medium
skills:
  ignoredSkills:
    - claude/hyperframes
    - claude/general-video
    - claude/motion-graphics
    - ponytail/ponytail
    - wisp/wisp
    - cheat-*
    - aws-*
    - gc-*
    - threejs-*
    - game-design
    - literature-search-*
    - semantic-scholar
    - read-arxiv-paper
task:
  disabledAgents:
    - code-reviewer
    - code-simplifier
    - comment-analyzer
    - pr-test-analyzer
    - silent-failure-hunter
    - type-design-analyzer